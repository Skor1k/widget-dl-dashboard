<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, -apple-system, sans-serif; font-size: 12px; background: #fff; color: #1e1e1e; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 12px 16px 8px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header h1 { font-size: 13px; font-weight: 600; }
    .tabs { display: flex; padding: 8px 16px 0; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; }
    .tab { padding: 6px 12px; cursor: pointer; font-size: 11px; color: #666; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: #1e1e1e; border-bottom-color: #0d99ff; font-weight: 500; }
    .content { flex: 1; overflow: auto; padding: 12px 16px; }
    textarea { width: 100%; height: 280px; font-family: monospace; font-size: 11px; border: 1px solid #e5e5e5; border-radius: 4px; padding: 8px; resize: vertical; outline: none; }
    textarea:focus { border-color: #0d99ff; }
    .actions { padding: 12px 16px; border-top: 1px solid #e5e5e5; display: flex; gap: 8px; flex-shrink: 0; }
    button { padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; }
    .btn-primary { background: #0d99ff; color: #fff; flex: 1; }
    .btn-primary:hover { background: #0a7fd4; }
    .btn-secondary { background: #f5f5f5; color: #333; }
    .btn-secondary:hover { background: #e8e8e8; }
    .btn-scan { background: #7c4dff; color: #fff; }
    .btn-scan:hover { background: #6639cc; }
    .log { font-family: monospace; font-size: 11px; line-height: 1.5; }
    .log-item { padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
    .log-item.error { color: #d93025; }
    .log-item.warning { color: #e67700; }
    .log-item.done { color: #1a7f37; font-weight: 500; }
    .log-item.status { color: #666; }
    .log-item.scan_progress { color: #444; }
    .copy-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    .btn-copy { background: #f5f5f5; color: #333; font-size: 11px; padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="header"><h1>Page to Figma</h1></div>
  <div class="tabs">
    <div class="tab active" data-tab="json">JSON</div>
    <div class="tab" data-tab="log">Лог</div>
    <div class="tab" data-tab="props">Пропсы</div>
  </div>
  <div class="content" id="tab-json">
    <textarea id="json-input" placeholder='{"name":"FormPage","page":{...},"variants":[]}'></textarea>
  </div>
  <div class="content" id="tab-log" style="display:none">
    <div class="log" id="log"></div>
  </div>
  <div class="content" id="tab-props" style="display:none">
    <div class="copy-row">
      <button class="btn-copy btn-secondary" id="btn-copy">Скопировать</button>
    </div>
    <textarea id="scan-output" readonly placeholder="Нажмите «Сканировать» — здесь появится JSON для .figma-propdefs-cache.json"></textarea>
  </div>
  <div class="actions">
    <button class="btn-primary" id="btn-generate">Создать в Figma</button>
    <button class="btn-scan" id="btn-scan">Сканировать</button>
    <button class="btn-secondary" id="btn-close">Закрыть</button>
  </div>
  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        switchTab(tab.dataset.tab);
      });
    });

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-tab="' + name + '"]').classList.add('active');
      document.getElementById('tab-json').style.display = name === 'json' ? '' : 'none';
      document.getElementById('tab-log').style.display = name === 'log' ? '' : 'none';
      document.getElementById('tab-props').style.display = name === 'props' ? '' : 'none';
    }

    document.getElementById('btn-generate').addEventListener('click', () => {
      const json = document.getElementById('json-input').value.trim();
      if (!json) { addLog('Вставьте JSON', 'error'); return; }
      parent.postMessage({ pluginMessage: { type: 'generate', json } }, '*');
      switchTab('log');
    });

    document.getElementById('btn-scan').addEventListener('click', () => {
      document.getElementById('log').innerHTML = '';
      addLog('Сканируем компоненты...', 'status');
      switchTab('log');
      parent.postMessage({ pluginMessage: { type: 'scan' } }, '*');
    });

    document.getElementById('btn-close').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    });

    document.getElementById('btn-copy').addEventListener('click', () => {
      const ta = document.getElementById('scan-output');
      ta.select();
      document.execCommand('copy');
      document.getElementById('btn-copy').textContent = 'Скопировано!';
      setTimeout(() => { document.getElementById('btn-copy').textContent = 'Скопировать'; }, 1500);
    });

    function addLog(text, type) {
      type = type || 'status';
      const log = document.getElementById('log');
      const item = document.createElement('div');
      item.className = 'log-item ' + type;
      item.textContent = text;
      log.appendChild(item);
      log.scrollTop = log.scrollHeight;
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'scan_progress') {
        addLog(msg.text, 'scan_progress');
      } else if (msg.type === 'scan_done') {
        addLog('Сканирование завершено. Перейдите в таб «Пропсы».', 'done');
        document.getElementById('scan-output').value = msg.json;
        switchTab('props');
      } else {
        addLog(msg.text, msg.type);
      }
    };
  </script>
</body>
</html>
